<!DOCTYPE html><html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><meta name="color-scheme" content="light only" /><title>Reset your password</title></head>
<body style="margin:0;padding:0;background-color:#F9FAFB;">
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color:#F9FAFB;padding:24px 12px">
  <tr><td align="center">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="max-width:600px;width:100%;background-color:#FFFFFF;border:1px solid #E0E0E0;border-radius:12px">
      <tr><td style="padding:22px 24px 16px 24px">
        <img src="https://swurv.tax/images/swurv-logo-black.png" alt="Swurv" height="32" style="height:32px;width:auto;display:block;border:0" />
      </td></tr>
      <tr><td bgcolor="#1F1E5B" style="background-color:#1F1E5B;padding:13px 24px">
        <span style="font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:600;color:#FFFFFF">Reset your password</span>
      </td></tr>
      <tr><td style="padding:22px 24px 26px 24px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.6;color:#2D3748">
        <p style="margin:0 0 10px 0">A password reset was requested for:</p><p style="margin:0;font-weight:600;color:#1F1E5B">{{username}}</p>
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="margin:26px 0 6px 0">
          <tr><td align="center" bgcolor="#F0790C" style="border-radius:10px">
            <a href="{{{link}}}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:13px 30px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:700;color:#16154A;text-decoration:none;border-radius:10px">Reset password</a>
          </td></tr>
        </table>
      </td></tr>
    </table>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="max-width:600px;width:100%">
      <tr><td style="padding:16px 24px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.5;color:#718096">If you did not request this, you can ignore this email and your password will stay unchanged. — {{appName}}</td></tr>
    </table>
  </td></tr>
</table>
</body></html>
